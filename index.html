<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Fylo data storage component</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="page">
      <div class="container">
        <div class="storage-actions box">
          <img class="logo" src="images/logo.svg" alt="fylo" />
          <div class="icons">
            <div class="icon">
              <img src="images/icon-document.svg" alt="" />
            </div>
            <div class="icon">
              <img src="images/icon-folder.svg" alt="" />
            </div>
            <div class="icon">
              <img src="images/icon-upload.svg" alt="" />
            </div>
          </div>
        </div>
        <div class="storage-info box">
          <p class="storage-description">
            You’ve used <strong>815 GB</strong> of your storage
          </p>
          <div class="storage-bar">
            <div class="storage-used"></div>
          </div>
          <div class="storage-limit">
            <span>0 GB</span>
            <span>1000 GB</span>
          </div>
          <div class="storage-left">
            <strong>185</strong> <span>GB LEFT</span>
          </div>
        </div>
      </div>
    </main>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="https://github.com/ahmedattlam10">ahmed.atlam</a>.
    </footer>
  </body>
</html>
